<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entre Mil Estrelas e Você</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#02040a;--gold:#c9a45c;--ivory:#efe6d2;--wine:#5e1424;--rose:#c98a9a;--silver:#b9c4d6;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--ivory);font-family:var(--serif);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#txt{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);width:min(760px,88vw);text-align:center;font-size:clamp(19px,2.6vw,28px);line-height:1.55;font-style:italic;color:var(--ivory);text-shadow:0 2px 18px #000,0 0 40px #000;opacity:0;transition:opacity 1.6s ease;pointer-events:none;z-index:3}
#txt.on{opacity:1}
#ch{position:fixed;top:max(5vh,env(safe-area-inset-top));left:0;right:0;text-align:center;letter-spacing:.45em;text-transform:uppercase;font-size:12px;color:var(--gold);opacity:0;transition:opacity 2s;z-index:3;pointer-events:none}
#ch.on{opacity:.85}
.btn{position:fixed;left:50%;bottom:max(5vh,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;font:inherit;font-size:19px;letter-spacing:.2em;color:var(--gold);background:rgba(2,4,10,.35);border:1px solid rgba(201,164,92,.5);padding:.8em 2.2em;border-radius:2px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.5s,background .4s,letter-spacing .6s}
.btn.on{opacity:1;pointer-events:auto}.btn:hover{background:rgba(201,164,92,.12);letter-spacing:.3em}
#skip{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(4.5vh,env(safe-area-inset-top));z-index:5;font:inherit;font-size:14px;letter-spacing:.15em;color:var(--silver);background:none;border:0;opacity:.55;cursor:pointer;padding:10px}
#fade{position:fixed;inset:0;background:#000;opacity:1;transition:opacity 1.3s ease;z-index:6;pointer-events:none}
#pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);width:min(560px,86vw);text-align:center;font-size:clamp(18px,2.3vw,24px);font-style:italic;line-height:1.5;opacity:0;transition:opacity 1.2s;z-index:3;pointer-events:none;text-shadow:0 0 24px #000;color:#f3d9de}

#pil{position:fixed;left:50%;top:18%;padding:1.1em 1.4em;background:radial-gradient(ellipse at center,rgba(2,4,10,.62),rgba(2,4,10,0) 72%);transform:translateX(-50%);width:min(600px,86vw);text-align:center;font-size:clamp(19px,2.5vw,27px);font-style:italic;line-height:1.5;color:#f4dfb0;opacity:0;transition:opacity 1.1s;z-index:3;pointer-events:none;text-shadow:0 0 22px #000,0 0 8px #000}
#pil.on{opacity:1}#pil:before{content:"❦";display:block;font-size:.8em;color:var(--gold);margin-bottom:.3em;opacity:.8}
#card{position:fixed;left:50%;top:40%;width:min(470px,86vw);padding:2.2em 1.8em 1.4em;text-align:center;font-style:italic;font-size:clamp(19px,2.4vw,24px);line-height:1.65;color:#f6e6e8;background:linear-gradient(160deg,rgba(62,16,32,.95),rgba(18,6,16,.97));border:1px solid rgba(201,164,92,.7);box-shadow:0 0 0 5px rgba(18,6,16,.9),0 0 0 6px rgba(201,164,92,.35),0 24px 60px rgba(0,0,0,.7),0 0 60px rgba(201,100,130,.18);transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;transition:opacity .7s,transform .7s;z-index:8;cursor:pointer}
#card.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#card i{display:block;font-style:normal;color:var(--gold);font-size:1.5em;margin-bottom:.3em}#card p{margin:0}
#card small{display:block;margin-top:1.3em;font-size:.55em;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.7;font-style:normal}
/* CARTA */
#letter{position:fixed;inset:0;z-index:2;display:none;background:radial-gradient(ellipse at 50% 30%,#3a2415 0,#1a0f09 45%,#07040a 100%);overflow:hidden}
#letter:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(0,0,0,.18) 0 3px,rgba(255,200,140,.03) 3px 9px,transparent 9px 22px);opacity:.7}
#glow{position:absolute;left:50%;top:18%;width:70vmax;height:70vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,170,80,.30),transparent 60%);animation:fl 4s ease-in-out infinite alternate;transition:opacity 3s}
@keyframes fl{to{opacity:.7;transform:translate(-50%,-50%) scale(1.06)}}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1400px}
#paper{position:relative;width:min(420px,84vw);height:min(560px,62vh);transition:width 2s cubic-bezier(.6,0,.2,1),height 2s cubic-bezier(.6,0,.2,1),transform 2s;transform:rotate(-2deg);filter:drop-shadow(0 30px 28px rgba(0,0,0,.65));cursor:pointer}
#paper.open{width:min(720px,94vw);height:min(86vh,900px);transform:rotate(0);cursor:default}
.sheet,.cover{position:absolute;inset:0;border-radius:3px 6px 4px 7px/6px 3px 7px 4px;background:
 radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 50%),
 radial-gradient(ellipse at 85% 90%,rgba(120,80,30,.28),transparent 55%),
 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .18 0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
 linear-gradient(160deg,#f2e8d0,#e4d3ae 60%,#d9c59b);box-shadow:inset 0 0 40px rgba(110,70,20,.35),inset 0 0 3px rgba(90,60,20,.6)}
.cover{transform-origin:top;transition:transform 1.8s cubic-bezier(.6,0,.3,1),opacity .6s 1.4s;backface-visibility:hidden;z-index:3}
.cover:after{content:"";position:absolute;left:0;right:0;top:48%;height:1px;background:rgba(90,60,20,.35);box-shadow:0 1px 0 rgba(255,255,255,.4)}
#paper.lift .cover{transform:rotateX(178deg);opacity:0}
.band{position:absolute;background:linear-gradient(90deg,#3d0a16,#7a1f33 40%,#4a0d1b 70%,#6b1a2c);z-index:4;transition:transform 1.4s cubic-bezier(.5,0,.3,1),opacity 1s .6s;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.band.v{left:50%;top:-4px;bottom:-4px;width:30px;margin-left:-15px}.band.h{top:50%;left:-4px;right:-4px;height:30px;margin-top:-15px;background:linear-gradient(180deg,#3d0a16,#7a1f33 40%,#4a0d1b 70%,#6b1a2c)}
#paper.untie .band.v{transform:translateY(-120%) rotate(8deg);opacity:0}#paper.untie .band.h{transform:translateX(120%) rotate(-5deg);opacity:0}
.bow{position:absolute;left:50%;top:50%;width:84px;height:54px;margin:-27px 0 0 -42px;z-index:5;transition:transform 1.2s,opacity 1s .4s}
.bow i{position:absolute;top:6px;width:38px;height:40px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 30%,#9a2a42,#4a0d1b);box-shadow:inset 0 -6px 8px rgba(0,0,0,.4)}
.bow i:nth-child(1){left:0;transform:rotate(-24deg)}.bow i:nth-child(2){right:0;transform:rotate(24deg)}
#paper.untie .bow{transform:translateY(70px) rotate(40deg) scale(.7);opacity:0}
#seal{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;z-index:6;transition:opacity 1s .8s}
#seal b{position:absolute;inset:0;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;background:radial-gradient(circle at 35% 30%,#7a2030,#2e0710 70%);box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,150,150,.25);display:flex;align-items:center;justify-content:center;color:#d8a45a;font-size:34px;transition:transform 1.2s cubic-bezier(.5,0,.3,1)}
#seal b:first-child{clip-path:polygon(0 0,58% 0,44% 40%,56% 62%,40% 100%,0 100%)}#seal b:last-child{clip-path:polygon(58% 0,100% 0,100% 100%,40% 100%,56% 62%,44% 40%)}
#paper.crack #seal b:first-child{transform:translate(-14px,3px) rotate(-14deg)}#paper.crack #seal b:last-child{transform:translate(14px,6px) rotate(12deg)}
#paper.untie #seal{opacity:0}
#inscr{position:absolute;left:0;right:0;top:12%;text-align:center;z-index:2;color:#5b4126;font-style:italic;font-size:22px;letter-spacing:.05em}
#cap{position:absolute;left:0;right:0;bottom:7%;text-align:center;z-index:2;color:#7a5a38;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
.sheet{z-index:1;overflow:hidden}
#read{position:absolute;inset:0;overflow-y:auto;padding:clamp(26px,6vw,64px) clamp(22px,6vw,70px);color:#3b2815;font-size:clamp(18px,2.3vw,23px);line-height:1.7;opacity:0;transition:opacity 1.5s 1.4s;-webkit-overflow-scrolling:touch}
#paper.open #read{opacity:1}
#read p{margin:0 0 1.05em;opacity:0;transform:translateY(8px);animation:rv 1.6s forwards;animation-play-state:paused}
#paper.open #read p{animation-play-state:running}
@keyframes rv{to{opacity:1;transform:none}}
#read h2{font-weight:400;font-style:italic;text-align:center;margin:0 0 1em;font-size:1.25em;color:#5e1424}
.hid{border-bottom:1px dotted #7a5a38;cursor:pointer}
.note{font-family:'Segoe Script','Bradley Hand',cursive;font-size:.72em;color:#4a5f88;transform:rotate(-2deg);display:block;margin:.2em 0 1.2em 12%}
.fin{text-align:center;font-size:1.12em;color:#5e1424}
.sig{text-align:right;font-style:italic;font-size:1.3em;clip-path:inset(0 100% 0 0);animation:sg 3s 1s forwards;animation-play-state:paused}
#paper.open .sig{animation-play-state:running}@keyframes sg{to{clip-path:inset(0 0 0 0)}}
#petal{position:absolute;right:9%;top:6%;width:26px;height:36px;border-radius:50% 0 50% 50%;background:radial-gradient(circle at 30% 30%,#d9a1ae,#8a3248);transform:rotate(28deg);opacity:0;transition:opacity 2s 3s;box-shadow:0 2px 4px rgba(0,0,0,.3);pointer-events:none}
#paper.open #petal{opacity:.85}
#again{position:absolute;bottom:max(2vh,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:7;opacity:0;pointer-events:none;transition:opacity 2s;font:inherit;background:none;border:0;color:var(--gold);letter-spacing:.2em;font-size:15px;cursor:pointer;padding:8px 16px}
#again.on{opacity:.8;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#glow{animation:none}}

</div>

<script>
/* ============ CONTEÚDO (edite aqui) ============ */
const SIGN="Com todo o meu amor";
const SCENES_TXT=[
 {ch:"Prólogo",btn:"Entre comigo.",lines:[
  "Há sentimentos tão vastos que a alma os guarda em silêncio, porque as palavras, pobres mensageiras, jamais lhes alcançam a grandeza.",
  "Alguns são fundos demais para uma simples declaração, e belos demais para permanecerem ocultos no peito.",

 {ch:"I · O jardim que floresce à noite",btn:"Atravessar o arco",lines:[
  "Há encontros que detêm o tempo, como se o próprio destino suspendesse o fôlego para ver duas almas se reconhecerem.",
  "Toque nas rosas, minha alma: cada uma guarda um suspiro meu.",
  "E assim o mundo, sendo o mesmo, tornou-se outro: bastou que você existisse para que tudo ganhasse um brilho que eu nem sabia pedir aos céus."]},
 {ch:"II · O palácio das palavras não ditas",btn:"Abrir a porta",lines:[
  "Há palavras que sonho em segredo, e que a timidez do peito não deixa chegar aos lábios.",
  "Nenhum louvor me parece digno de você; todos nascem pequenos diante do que meu coração inteiro queria dizer.",

 {ch:"III · O oceano do infinito",btn:"Continuar",lines:[
  "Quantas vezes tentei medir, em palavras, o que você significa para esta alma que lhe pertence.",

 {ch:"IV · Um universo chamado você",btn:"Continuar",lines:[

  "A ternura das flores que desabrocham ao luar.\nA grandeza dos mares que não têm fim.\nO silêncio sagrado de uma noite estrelada.",
  "E aquele desejo, doce e imenso, de que o instante ao seu lado jamais chegasse ao fim.",
  "Mas ainda resta uma coisa que a minha alma precisa lhe dizer."]}];
const ROSES=["Há quem chegue sem rumor, como a aurora, e quando damos por isso, já lhe pertence a luz de todos os nossos dias.",
 "Em você, os instantes mais simples se vestem de eternidade, e eu os guardo no peito como quem guarda relíquias.",
 "O amor verdadeiro não se explica: sente-se, como se pressente o perfume de uma rosa antes mesmo de vê-la."];
const PILLARS=["Amar é deixar a alma morar noutra alma.",
 "Em seus olhos encontrei a pátria que o meu coração procurava.",
 "Se existe eternidade, que seja o tempo em que eu puder pensar em você.",
 "Quanta saudade cabe num suspiro, e quanto amor cabe numa saudade!",
 "O seu nome é a prece que o meu coração repete em silêncio.",
 "E de porta em porta, só encontro você ao fim de todos os caminhos."];
const OCEAN=["Cada onda que beija a praia traz o seu nome.",
 "Mais fundo que o mar é o meu querer.",
 "O luar escreve nas águas o seu nome.",
 "O infinito é pequeno diante deste amor.",
 "Sou o mar; você, a lua que me move."];
const CLOSED={insc:"Para você",cap:"toque para abrir",first:"Guardei, para você, as palavras que o coração não soube calar."};
/* Carta: troque os trechos entre [colchetes] por detalhes reais de vocês, se quiser. */
const LETTER=[
 "Existem datas que a vida marca em silêncio, como quem acende uma pequena luz no meio da noite. O dia em que você chegou ao mundo é uma delas, e hoje percebo que, sem saber, eu já devia gratidão a ele.",
 "Porque há presenças que mudam o modo como os dias são vistos. Depois que você apareceu, as horas simples ganharam outra cor: um instante comum passou a merecer ser guardado, e o tempo, que costuma correr, aprendeu a andar mais devagar ao seu lado.",
 "<span class='note'>escrevi, apaguei e escrevi de novo.</span>",
 "Admiro quem você é. A sua maneira de existir é só sua, e talvez seja justamente isso que a torna tão difícil de esquecer: não há outra igual, nem poderia haver. Há pessoas que chegam à nossa história sem perceber a beleza que começam a escrever, e você é uma delas.",

 "Do futuro não peço promessas grandes demais. Peço apenas a beleza de continuar te conhecendo: descobrir os capítulos que ainda não li, criar lembranças que ainda não existem, e deixar que o tempo diga, com calma, aquilo que for dele dizer.",
 "Desejo que a vida seja gentil com você. Que tenha saúde, paz no coração e coragem nos dias difíceis; que as oportunidades a encontrem, que as conquistas cheguem no seu tempo, e que estejam sempre por perto pessoas capazes de reconhecer o quanto você vale.",
 "Se as estrelas pudessem guardar segredos, talvez conhecessem alguns dos meus. O maior deles é simples: ao seu lado, o mundo se torna mais habitável, e eu me torno alguém que quer ser melhor.",
 "<p class='fin'>Feliz aniversário, meu amor.<br>Que a vida seja gentil com você, que seus sonhos encontrem caminhos e que nunca lhe faltem motivos para sorrir.<br>Você merece coisas lindas.</p>"];

/* ============ MOTOR ============ */
const $=id=>document.getElementById(id),cv=$('c'),X=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,AMP=RM?.35:1;
let W,H,DPR;function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',rs);rs();
const rng=s=>()=>(s=(s*16807+7)%2147483647)/2147483647;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const STARS=(()=>{const r=rng(11),a=[];for(let i=0;i<320;i++)a.push([r(),Math.pow(r(),1.4),r()*1.2+.3,r()*6]);return a})();
function sky(c1,c2,hz){const g=X.createLinearGradient(0,0,0,hz||H);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(0,0,W,H)}
function stars(t,lim,k=1){for(const s of STARS){const y=s[1]*lim;if(y>lim)continue;const a=(.35+.65*Math.abs(Math.sin(t*.6+s[3])))*k;X.fillStyle=`rgba(225,232,255,${a*.8})`;X.fillRect(s[0]*W,y,s[2],s[2])}}
function moon(x,y,r,k=1){let g=X.createRadialGradient(x,y,r*.6,x,y,r*7);g.addColorStop(0,`rgba(190,205,240,${.28*k})`);g.addColorStop(1,'rgba(190,205,240,0)');X.fillStyle=g;X.fillRect(x-r*7,y-r*7,r*14,r*14);
 g=X.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,'#f4f6ff');g.addColorStop(1,'#aab6d4');X.fillStyle=g;X.beginPath();X.arc(x,y,r,0,7);X.fill()}
function ridge(y,amp,seed,col,sx=0){const r=rng(seed);X.fillStyle=col;X.beginPath();X.moveTo(0,H);let h=0;for(let x=-20;x<=W+40;x+=24){h=h*.6+(r()-.5)*amp;X.lineTo(x+sx,y+h+Math.sin((x+seed*40)*.004)*amp*.8)}X.lineTo(W+40,H);X.fill()}
function mist(y,a,t,col='170,190,225'){for(let i=0;i<4;i++){const x=((t*(8+i*5)+i*300)%(W+600))-300,g=X.createRadialGradient(x,y+i*8,10,x,y+i*8,W*.45);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);X.fillStyle=g;X.fillRect(0,y-120,W,260)}}
function glow(x,y,r,c,a){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2)}
function tree(x,y,h,seed,col,t,sw=1){const r=rng(seed);X.strokeStyle=col;X.fillStyle=col;X.lineCap='round';const s=Math.sin(t*.5+seed)*h*.01*sw;
 X.lineWidth=h*.05;X.beginPath();X.moveTo(x,y);X.quadraticCurveTo(x+(r()-.5)*h*.1,y-h*.4,x+s,y-h*.62);X.stroke();
 for(let b=0;b<6;b++){const bx=x+s*(.4+b*.1),by=y-h*(.35+b*.08),d=(b%2?1:-1)*h*(.12+r()*.18);X.lineWidth=h*.018;X.beginPath();X.moveTo(bx,by);X.quadraticCurveTo(bx+d*.5,by-h*.1,bx+d+s,by-h*.2);X.stroke();
  for(let k=0;k<4;k++){X.beginPath();X.ellipse(bx+d+s+(r()-.5)*h*.2,by-h*.2+(r()-.5)*h*.12,h*(.06+r()*.07),h*(.045+r()*.05),r()*3,0,7);X.fill()}}
 for(let k=0;k<9;k++){X.beginPath();X.ellipse(x+s+(r()-.5)*h*.4,y-h*.7+(r()-.5)*h*.2,h*(.07+r()*.08),h*(.05+r()*.06),r()*3,0,7);X.fill()}}

 if(my!==tk)return;if(i===2){txt.classList.remove('on');tp=performance.now();while(pc<6||pilBusy||pilQ.length){await sleep(300);if(my!==tk)return}await sleep(1500);if(my!==tk)return}if(i===3){txt.classList.remove('on');shT=performance.now();await sleep(3200+OCEAN.length*6000);if(my!==tk)return}go.classList.add('on');}
